<script>
  // Workarounds for the bundled reveal.js-menu plugin:
  //   1. Open button renders as <a href="#"><i class="fas fa-bars"></i></a>
  //      with no accessible name (axe link-name; quarto-cli#14249, fix in flight at #14251).
  //   2. Active menu panel is scrollable but has no tabindex, so keyboard
  //      users can't arrow-scroll it (axe scrollable-region-focusable).
  (function () {
    function patchButton() {
      var link = document.querySelector('.slide-menu-button > a[href="#"]');
      if (!link) return false;
      if (!link.hasAttribute('aria-label')) {
        link.setAttribute('aria-label', 'Toggle menu');
      }
      return true;
    }
    function patchPanels() {
      var panels = document.querySelectorAll('.slide-menu-panel');
      if (panels.length === 0) return false;
      panels.forEach(function (p) {
        if (!p.hasAttribute('tabindex')) p.setAttribute('tabindex', '0');
      });
      return true;
    }
    function patch() {
      return patchButton() && patchPanels();
    }
    if (patch()) return;
    new MutationObserver(function (_, obs) {
      if (patch()) obs.disconnect();
    }).observe(document.body, { childList: true, subtree: true });
  })();
</script>
